name: PHP environments integration
on:
  workflow_dispatch:

jobs:
  docker:
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libegl1 libgl1 libdbus-1-3 libfontconfig1 libxkbcommon0
          python -m pip install -r requirements.txt
      - name: Shared environments and migration
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m tests.integration_environments
