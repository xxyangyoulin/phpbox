name: Build & Release

on:
  push:
    tags:
      - 'v*.*.*'       # 推送版本 tag 时自动触发，如 v1.2.0
  workflow_dispatch:   # 也可以在 GitHub 网页上手动触发
    inputs:
      version:
        description: '版本号（如 1.0.0，不带 v 前缀）'
        required: false
        default: 'dev'

jobs:
  compatibility:
    uses: ./.github/workflows/compatibility.yml
  build:
    needs: compatibility
    runs-on: ubuntu-22.04
    permissions:
      contents: write   # 允许创建 Release 和上传附件

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装系统依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxcb-xinerama0 libxcb-cursor0 \
            libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 libxcb-shape0 \
            libxcb-xfixes0 libxcb-xkb1 libxkbcommon-x11-0 \
            libgl1 libegl1 libdbus-1-3 \
            dpkg-dev libfuse2

      - name: 设置 Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 安装 Python 依赖
        run: pip install -r requirements.txt

      - name: 解析版本号
        id: version
        env:
          REQUESTED_VERSION: ${{ github.event.inputs.version }}
        run: |
          VERSION=$(python -c 'from core.version import VERSION; print(VERSION)')
          if [[ "${GITHUB_REF}" == refs/tags/v* && "${GITHUB_REF#refs/tags/v}" != "$VERSION" ]]; then
            echo "Tag 与应用版本不一致"
            exit 1
          fi
          if [[ -n "$REQUESTED_VERSION" && "$REQUESTED_VERSION" != dev && "$REQUESTED_VERSION" != "$VERSION" ]]; then
            echo "手动指定版本与应用版本不一致，请先更新 core/version.py"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      # ── 构建二进制 ──────────────────────────────────────────
      - name: 构建二进制（PyInstaller）
        run: |
          rm -rf build/
          python -m PyInstaller phpbox.spec --noconfirm
          ./dist/phpbox/phpbox -h
          echo "二进制大小: $(du -sh dist/phpbox | cut -f1)"
          tar -C dist -czf dist/phpbox-linux-x86_64.tar.gz phpbox

      - name: 打包后界面启动检查
        run: |
          set +e
          QT_QPA_PLATFORM=offscreen timeout --kill-after=5s 8s ./dist/phpbox/phpbox > /tmp/phpbox-gui.log 2>&1
          STATUS=$?
          set -e
          cat /tmp/phpbox-gui.log
          test "$STATUS" -eq 124

      # ── 构建 AppImage ────────────────────────────────────────
      - name: 下载 appimagetool
        run: |
          wget -q \
            https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage \
            -O /tmp/appimagetool
          chmod +x /tmp/appimagetool

      - name: 构建 AppImage
        run: |
          APPDIR="AppDir"
          rm -rf "$APPDIR"
          mkdir -p "$APPDIR/usr/bin"
          mkdir -p "$APPDIR/usr/share/applications"
          mkdir -p "$APPDIR/usr/share/icons/hicolor/256x256/apps"

          cp -r dist/phpbox/. "$APPDIR/usr/bin/"
          cp phpbox.desktop "$APPDIR/usr/share/applications/"
          ln -sf usr/share/applications/phpbox.desktop "$APPDIR/phpbox.desktop"

          cat > "$APPDIR/AppRun" << 'EOF'
          #!/bin/bash
          SELF=$(readlink -f "$0")
          HERE=${SELF%/*}
          export PATH="${HERE}/usr/bin:${PATH}"
          exec "${HERE}/usr/bin/phpbox" "$@"
          EOF
          chmod +x "$APPDIR/AppRun"

          if [ -f "resources/icons/phpbox-256.png" ]; then
            cp resources/icons/phpbox-256.png "$APPDIR/phpbox.png"
            cp resources/icons/phpbox-256.png \
               "$APPDIR/usr/share/icons/hicolor/256x256/apps/phpbox.png"
          else
            touch "$APPDIR/phpbox.png"
          fi

          # --appimage-extract-and-run 绕过 CI 环境中 FUSE 不可用的问题
          ARCH=x86_64 /tmp/appimagetool --appimage-extract-and-run \
            "$APPDIR" dist/phpbox-x86_64.AppImage
          rm -rf "$APPDIR"
          echo "AppImage 大小: $(du -sh dist/phpbox-x86_64.AppImage | cut -f1)"

      # ── 构建 .deb ────────────────────────────────────────────
      - name: 构建 .deb 包
        run: |
          sh resources/build-deb.sh "${{ steps.version.outputs.version }}"

      - name: 旧版 dpkg 解包兼容性
        run: |
          docker run --rm --network none -v "$PWD/dist:/packages:ro" ubuntu:20.04 \
            dpkg --unpack "/packages/phpbox_${{ steps.version.outputs.version }}_amd64.deb"

      - name: deb 安装后检查命令和图标
        run: |
          docker run --rm -v "$PWD/dist:/packages:ro" ubuntu:22.04 sh -ec '
            apt-get update -qq
            DEBIAN_FRONTEND=noninteractive apt-get install -y "$1"
            phpbox --help > /dev/null
            test "$(phpbox --version)" = "pbox $2"
            test "$(pbox --version)" = "pbox $2"
            test "$(pbox-proxy --version)" = "pbox $2"
            test -s /usr/share/icons/hicolor/256x256/apps/phpbox.png
            grep -qx "Icon=phpbox" /usr/share/applications/phpbox.desktop
          ' sh "/packages/phpbox_${{ steps.version.outputs.version }}_amd64.deb" "${{ steps.version.outputs.version }}"

      # ── 上传 Artifacts（每次构建都保留）──────────────────────
      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: phpbox-linux-x86_64-${{ steps.version.outputs.version }}
          path: |
            dist/phpbox-linux-x86_64.tar.gz
            dist/phpbox-x86_64.AppImage
            dist/phpbox_*_amd64.deb
          retention-days: 30

      # ── 创建 Release（仅 tag 触发时）─────────────────────────
      - name: 创建 GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: "phpbox v${{ steps.version.outputs.version }}"
          generate_release_notes: true   # 自动从 commit 生成 changelog
          files: |
            dist/phpbox-linux-x86_64.tar.gz
            dist/phpbox-x86_64.AppImage
            dist/phpbox_*_amd64.deb
